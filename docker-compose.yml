# Levanta Postgres + backend para desarrollo local.
#
#   docker compose up --build
#
# La primera vez, aplica el seed de usuarios a mano (las migraciones crean
# las tablas pero no insertan datos -- ver base-datos/README.md y
# base-datos/auth/seed.sql para el contenido completo, admin/op1/op2 con
# contraseña "pass1234", solo para desarrollo local):
#
#   docker compose exec db psql -U dev -d greencircle_db -f /dev/stdin < base-datos/auth/seed.sql
#
# app-movil NO está incluido aquí -- tiene su propio repo (ver .gitignore) y
# corre con Expo, no con Docker.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: greencircle_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d greencircle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:CHANGE_ME@db:5432/greencircle_db
      JWT_SECRET: CHANGE_ME_TO_A_LONG_RANDOM_STRING
      JWT_EXPIRE_MINUTES: "480"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  db_data:
